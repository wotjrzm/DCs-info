name: collect

on:
  schedule:
    - cron: '0 23,3,9,13 * * *'
  workflow_dispatch:
  push:
    branches: [main, feature/sale-tracker]
    paths:
      - 'watchlist.txt'
      - 'site/**'
      - 'tracker/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Check out the branch tip (not the triggering SHA) so a run that waited in the
      # concurrency queue starts from the previous run's data commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Restore previous sale_items.json from deployed site
        run: |
          mkdir -p data
          curl -fsSL "${SITE_URL%/}/data/sale_items.json" -o data/sale_items.json || rm -f data/sale_items.json

      - name: Run collector
        id: collect
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          set +e
          python -m tracker.run
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit watch and status data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/watch.json data/status.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update data [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Build site artifact
        run: |
          mkdir -p _site/data
          if [ -d site ]; then cp -R site/. _site/; fi
          cp -R data/. _site/data/

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'

      - name: Fail if collector failed
        if: steps.collect.outputs.code != '0'
        env:
          CODE: ${{ steps.collect.outputs.code }}
        run: |
          echo "Collector exited with code $CODE"
          exit 1

  deploy:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
