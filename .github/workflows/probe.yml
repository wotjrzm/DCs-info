# Temporary probe: checks that each brand endpoint is reachable from GitHub Actions. Removed in Task 9.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [feature/sale-tracker]
    paths: ['.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe brand endpoints
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          probe() {
            name="$1"; url="$2"; accept="$3"
            echo "=== $name"
            echo "URL: $url"
            curl -sS --max-time 20 -A "$UA" -H "Accept-Language: ko-KR,ko;q=0.9" -H "Accept: $accept" \
              -o body.txt -w "HTTP %{http_code} size=%{size_download}\n" "$url" || echo "curl failed ($?)"
            echo "--- first 200 chars:"
            head -c 200 body.txt | tr '\n' ' '
            echo
            sleep 2
          }
          probe musinsa-list "https://api.musinsa.com/api2/dp/v2/plp/goods?gf=A&sortCode=DISCOUNT_RATE&brand=musinsastandard&page=1&size=30&caller=FLAGSHIP" "application/json"
          probe musinsa-product "https://www.musinsa.com/products/2463944" "text/html"
          grep -o '"salePrice":[0-9]*,"normalPrice":[0-9]*' body.txt | head -1 || true
          probe uniqlo-list "https://www.uniqlo.com/kr/api/commerce/v5/ko/products?path=&flagCodes=discount&limit=36&offset=0&httpFailure=true" "application/json"
          probe uniqlo-detail "https://www.uniqlo.com/kr/api/commerce/v5/ko/products/E486821-000/price-groups/00/details?withPrices=true&withStocks=true&includeModelSize=false&httpFailure=true" "application/json"
          probe spao-list "https://www.spao.com/api/item/sale?size=100&dispLctgNo=2605000005&sort=40&page=1" "application/json"
          probe spao-product "https://www.spao.com/i/item?itemNo=2607013428&lowerVendNo=LV26000002" "text/html"
          grep -o '"orgSellPrice":[0-9]*,"sellPrice":[0-9]*' body.txt | head -1 || true
